name: "setup-tsproject"
description: "Set up pnpm and Node.js with caching, run pnpm install --frozen-lockfile, and optionally build the workspace (the repository must already be checked out)"

inputs:
  node-version:
    description: "Node.js version"
    required: false
    default: "24"
  build:
    description: "Run pnpm run build after install (workspace packages resolve through dist/)"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # pnpm version is resolved from the packageManager field
    - name: setup-pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: setup-node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: "pnpm"

    # the prepare script (setup-dev-env.sh) skips itself when CI is set
    - name: install-packages
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: build-packages
      if: inputs.build == 'true'
      shell: bash
      run: pnpm run build
