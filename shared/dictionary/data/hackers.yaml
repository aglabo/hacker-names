  fullname: Donald E. Knuth
  description: "Author of The Art of Computer Programming and creator of TeX; 1974 Turing Award."
  category: turing

dijkstra:
  fullname: Edsger W. Dijkstra
  description: "Pioneer of structured programming and the shortest-path algorithm; 1972 Turing Award."
  category: turing

lamport:
